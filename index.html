<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>নাইন এস টু সিক্সটিন - 9S216</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
            touch-action: none;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 850px;
            background: #000;
            display: flex;
            flex-direction: column;
            position: relative;
            border-radius: 0px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }
        /* Header */
        .header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            z-index: 10;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .status-badge {
            background: rgba(255,255,255,0.1);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Camera Preview (Canvas) */
        .camera-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            position: relative;
            overflow: hidden;
        }
        #filterCanvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #000;
            image-rendering: auto;
        }
        /* Recording Overlay */
        .rec-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.15);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .rec-indicator.active {
            opacity: 1;
        }
        .rec-dot {
            width: 14px;
            height: 14px;
            background: #ff3b30;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        .rec-timer {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .size-counter {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
        }
        .size-counter span {
            color: #fff;
            font-weight: 700;
        }

        /* Controls */
        .controls {
            padding: 20px 24px 30px;
            background: rgba(10,10,10,0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .controls-top {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
            margin: 0 5px;
            border: 1px solid rgba(255,255,255,0.05);
            letter-spacing: 0.3px;
        }
        .btn:active {
            transform: scale(0.94);
        }
        .btn-primary {
            background: #0095f6;
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(0,149,246,0.3);
        }
        .btn-primary:active {
            background: #0077c7;
        }
        .btn-danger {
            background: #ff3b30;
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(255,59,48,0.3);
        }
        .btn-danger:active {
            background: #d92b21;
        }
        .btn-success {
            background: #34c759;
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(52,199,89,0.3);
        }
        .btn-success:active {
            background: #28a745;
        }
        .btn:disabled {
            opacity: 0.3;
            transform: scale(0.95);
            pointer-events: none;
        }
        .icon-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        .icon-btn:active {
            transform: scale(0.9);
            background: rgba(255,255,255,0.1);
        }

        /* Modal / Preview */
        .preview-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }
        .preview-modal.active {
            display: flex;
        }
        .preview-modal video {
            width: 100%;
            max-height: 65vh;
            border-radius: 16px;
            background: #000;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .preview-actions {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            width: 100%;
            justify-content: center;
        }
        .preview-actions .btn {
            flex: 0 1 40%;
        }
        .close-preview {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 28px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .close-preview:active {
            transform: scale(0.9);
        }

        @media (max-width: 480px) {
            .btn { font-size: 13px; padding: 10px 16px; }
            .header h1 { font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <!-- Header -->
    <div class="header">
        <h1>📱 9S216</h1>
        <div class="status-badge" id="statusBadge">● লাইভ</div>
    </div>

    <!-- Camera -->
    <div class="camera-wrapper">
        <canvas id="filterCanvas"></canvas>
        <!-- Recording Indicator -->
        <div class="rec-indicator" id="recIndicator">
            <div class="rec-dot"></div>
            <span class="rec-timer" id="recTimer">00:00</span>
        </div>
        <div class="size-counter" id="sizeCounter">📦 <span id="fileSizeDisplay">0.00</span> MB / 5.00 MB</div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <div class="controls-top">
            <button class="btn btn-primary" id="startBtn">▶ রেকর্ড শুরু</button>
            <button class="btn btn-danger" id="stopBtn" disabled>⏹ থামাও</button>
        </div>
        <div class="controls-top" style="gap: 10px;">
            <button class="btn btn-success" id="previewBtn" disabled>👁 প্রিভিউ</button>
            <button class="btn" id="downloadBtn" disabled style="background:#f09433; border:none; color:#fff;">⬇ ডাউনলোড</button>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="preview-modal" id="previewModal">
        <button class="close-preview" id="closePreviewBtn">✕</button>
        <video id="previewVideo" controls playsinline></video>
        <div class="preview-actions">
            <button class="btn btn-success" id="modalDownloadBtn">⬇ ডাউনলোড</button>
            <button class="btn" id="modalCloseBtn" style="background:rgba(255,255,255,0.1);">বন্ধ</button>
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // DOM Elements
        const canvas = document.getElementById('filterCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const previewBtn = document.getElementById('previewBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const recIndicator = document.getElementById('recIndicator');
        const recTimer = document.getElementById('recTimer');
        const fileSizeDisplay = document.getElementById('fileSizeDisplay');
        const statusBadge = document.getElementById('statusBadge');
        const previewModal = document.getElementById('previewModal');
        const previewVideo = document.getElementById('previewVideo');
        const closePreviewBtn = document.getElementById('closePreviewBtn');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const modalDownloadBtn = document.getElementById('modalDownloadBtn');

        // State
        let stream = null;
        let videoTrack = null;
        let audioTrack = null;
        let canvasStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let startTime = 0;
        let timerInterval = null;
        let animationFrame = null;
        let maxSizeBytes = 4.8 * 1024 * 1024; // 4.8 MB (safe margin)
        let currentSize = 0;
        let isFrontCamera = false; // start with back

        // Constraints
        const VIDEO_CONSTRAINTS = {
            audio: true,
            video: {
                facingMode: 'environment',
                width: { ideal: 1280 },
                height: { ideal: 720 },
                frameRate: { ideal: 30 }
            }
        };

        // --- 1. Initialize Camera ---
        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia(VIDEO_CONSTRAINTS);
                videoTrack = stream.getVideoTracks()[0];
                audioTrack = stream.getAudioTracks()[0];

                // Set canvas to video dimensions
                const settings = videoTrack.getSettings();
                const width = settings.width || 1280;
                const height = settings.height || 720;
                canvas.width = width;
                canvas.height = height;

                // Start drawing filter loop
                drawFrame();
                statusBadge.textContent = '● লাইভ';
                statusBadge.style.color = '#34c759';

                // Enable start button
                startBtn.disabled = false;
                startBtn.textContent = '▶ রেকর্ড শুরু';

                return true;
            } catch (err) {
                console.error('Camera error:', err);
                alert('ক্যামেরা অ্যাক্সেস করা যায়নি। অনুগ্রহ করে অনুমতি দিন।');
                statusBadge.textContent = '✕ ক্যামেরা বন্ধ';
                statusBadge.style.color = '#ff3b30';
                return false;
            }
        }

        // --- 2. Draw Frame with INSTAGRAM-STYLE FILTER (Cinematic + Vibrant) ---
        function drawFrame() {
            if (!stream) return;
            const video = document.createElement('video');
            video.srcObject = stream;
            video.play();
            video.onloadeddata = () => {
                function render() {
                    if (!stream) return;
                    // Draw original frame
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    // ===== INSTAGRAM CINEMATIC FILTER (Auto-applied) =====
                    // 1. Base color grading (warm, punchy)
                    ctx.filter = 'contrast(1.3) saturate(1.6) brightness(1.05) sepia(0.08)';
                    ctx.drawImage(canvas, 0, 0);
                    ctx.filter = 'none'; // reset

                    // 2. Vignette (dark corners for cinematic look)
                    const gradient = ctx.createRadialGradient(
                        canvas.width/2, canvas.height/2, canvas.height * 0.3,
                        canvas.width/2, canvas.height/2, canvas.height * 0.9
                    );
                    gradient.addColorStop(0, 'rgba(0,0,0,0)');
                    gradient.addColorStop(0.7, 'rgba(0,0,0,0)');
                    gradient.addColorStop(1, 'rgba(0,0,0,0.45)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // 3. Slight sharpening effect via edge contrast (simulated by tiny overlay)
                    // (Keeping it simple with just filter + vignette, which is plenty for IG style)

                    animationFrame = requestAnimationFrame(render);
                }
                render();
            };
        }

        // --- 3. Start Recording ---
        function startRecording() {
            if (!stream || isRecording) return;

            // Prepare canvas stream with audio
            canvasStream = canvas.captureStream(30);
            if (audioTrack) {
                canvasStream.addTrack(audioTrack);
            }

            // Determine MIME type (prefer VP9 for quality/size, fallback VP8)
            let mimeType = 'video/webm;codecs=vp9';
            if (!MediaRecorder.isTypeSupported(mimeType)) {
                mimeType = 'video/webm;codecs=vp8';
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'video/webm';
                }
            }

            const options = {
                mimeType: mimeType,
                videoBitsPerSecond: 2500000, // 2.5 Mbps
                audioBitsPerSecond: 96000
            };

            try {
                mediaRecorder = new MediaRecorder(canvasStream, options);
            } catch (e) {
                alert('আপনার ব্রাউজার ভিডিও রেকর্ড সাপোর্ট করে না। ক্রোম ব্যবহার করুন।');
                return;
            }

            recordedChunks = [];
            currentSize = 0;
            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) {
                    recordedChunks.push(event.data);
                    currentSize += event.data.size;
                    updateSizeDisplay();

                    // Auto-stop if approaching 5 MB
                    if (currentSize >= maxSizeBytes) {
                        if (isRecording) {
                            stopRecording('সীমা পূর্ণ (৫ এমবি)');
                        }
                    }
                }
            };

            mediaRecorder.onstop = () => {
                isRecording = false;
                clearInterval(timerInterval);
                recIndicator.classList.remove('active');
                startBtn.disabled = false;
                startBtn.textContent = '▶ নতুন রেকর্ড';
                stopBtn.disabled = true;
                if (recordedChunks.length > 0) {
                    previewBtn.disabled = false;
                    downloadBtn.disabled = false;
                    statusBadge.textContent = '✅ রেকর্ড শেষ';
                    statusBadge.style.color = '#f09433';
                } else {
                    previewBtn.disabled = true;
                    downloadBtn.disabled = true;
                }
            };

            // Start
            mediaRecorder.start(1000); // collect chunks every second
            isRecording = true;
            startTime = Date.now();

            // UI updates
            recIndicator.classList.add('active');
            stopBtn.disabled = false;
            startBtn.disabled = true;
            previewBtn.disabled = true;
            downloadBtn.disabled = true;
            statusBadge.textContent = '🔴 রেকর্ডিং...';
            statusBadge.style.color = '#ff3b30';

            // Timer
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const secs = String(elapsed % 60).padStart(2, '0');
                recTimer.textContent = `${mins}:${secs}`;
            }, 1000);

            // Disable start button
            startBtn.textContent = '⏳ রেকর্ডিং...';
        }

        // --- 4. Stop Recording ---
        function stopRecording(reason = 'ম্যানুয়াল') {
            if (!isRecording || !mediaRecorder) return;
            mediaRecorder.stop();
            canvasStream.getTracks().forEach(t => t.stop());
            // Note: Keep main stream alive for preview
        }

        // --- 5. Update Size Display ---
        function updateSizeDisplay() {
            const mb = currentSize / (1024 * 1024);
            fileSizeDisplay.textContent = mb.toFixed(2);
            if (currentSize >= maxSizeBytes) {
                fileSizeDisplay.style.color = '#ff3b30';
            } else {
                fileSizeDisplay.style.color = '#fff';
            }
        }

        // --- 6. Preview Video ---
        function showPreview() {
            if (recordedChunks.length === 0) return;
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            previewVideo.src = url;
            previewModal.classList.add('active');
        }

        function closePreview() {
            previewModal.classList.remove('active');
            previewVideo.pause();
            previewVideo.src = '';
            URL.revokeObjectURL(previewVideo.src);
        }

        // --- 7. Download Video ---
        function downloadVideo() {
            if (recordedChunks.length === 0) return;
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `9S216_instagram_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // --- Event Listeners ---
        startBtn.addEventListener('click', startRecording);
        stopBtn.addEventListener('click', () => stopRecording('থামানো হয়েছে'));
        previewBtn.addEventListener('click', showPreview);
        downloadBtn.addEventListener('click', downloadVideo);
        closePreviewBtn.addEventListener('click', closePreview);
        modalCloseBtn.addEventListener('click', closePreview);
        modalDownloadBtn.addEventListener('click', () => {
            downloadVideo();
            closePreview();
        });

        // Init on load
        window.addEventListener('load', () => {
            initCamera();
        });

        // Clean up on page close
        window.addEventListener('beforeunload', () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
            if (animationFrame) cancelAnimationFrame(animationFrame);
            if (timerInterval) clearInterval(timerInterval);
            if (mediaRecorder && isRecording) mediaRecorder.stop();
        });

        // Double tap to switch camera (bonus feature)
        let lastTap = 0;
        canvas.addEventListener('dblclick', async () => {
            if (isRecording) return;
            isFrontCamera = !isFrontCamera;
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
            }
            VIDEO_CONSTRAINTS.video.facingMode = isFrontCamera ? 'user' : 'environment';
            await initCamera();
        });

        console.log('📱 9S216 (Nine S Two Sixteen) - Instagram Filter Camera loaded!');
        console.log('🎥 Max size: 5MB | Quality: 2.5Mbps VP9/VP8 | Filter: Cinematic IG');
    })();
</script>

</body>
</html>
